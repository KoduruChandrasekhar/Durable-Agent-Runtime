global:
  scrape_interval: 2s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: keel-server
    static_configs: [{targets: ["server:8080", "server-standby:8080"]}]
  - job_name: keel-gateway
    static_configs: [{targets: ["gateway:8090"]}]
  - job_name: keel-sandbox
    static_configs: [{targets: ["sandbox:8095"]}]
  - job_name: keel-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
